<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tortodrone · Control room</title><link rel="stylesheet" href="/admin/assets/app.css"><script type="module" src="/admin/assets/app.js"></script></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="login" class="login"><form id="login-form"><div class="brand">TORTODRONE <span>CONTROL ROOM</span></div><p class="eyebrow">SECURE ADMINISTRATION</p><h1>Welcome back.</h1><p>Sign in with your WebUI identity.</p><label>Username<input name="username" autocomplete="username" required maxlength="64"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button type="submit">Sign in</button><p id="login-error" role="alert"></p><small>First administrator? Use the local <code>--webui-user</code> command.</small></form></div>
<div id="shell" hidden><aside><a class="brand" href="#dashboard">TORTODRONE<span>CONTROL ROOM</span></a><p class="eyebrow">OPERATIONS</p><nav id="navigation" aria-label="Administration"></nav><footer><span id="identity"></span><button id="theme" class="quiet">Switch theme</button><button id="logout" class="quiet">Sign out</button></footer></aside><div class="workspace"><header><span id="connection" class="badge">Connecting</span><span id="clock"></span></header><main id="main" tabindex="-1"><div class="page-heading"><div><p class="eyebrow">TORTODRONE / ADMINISTRATION</p><h1 id="title">Overview</h1><p id="subtitle"></p></div><button id="refresh" class="secondary">Refresh</button></div><div id="notice" role="status" aria-live="polite"></div><section id="page" data-screen-label="Administration"></section></main></div></div>
<dialog id="dialog"><form id="editor"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="quiet" aria-label="Close dialog">×</button></div><p id="dialog-description"></p><div id="fields"></div><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-dialog" class="secondary">Cancel</button><button type="submit" id="submit-dialog">Confirm change</button></div></form></dialog>
</body></html>
