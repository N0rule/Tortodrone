# Address to listen on. 0.0.0.0 accepts connections through all IPv4 interfaces.
server-ip=0.0.0.0
server-port=47624
# Maximum simultaneous connections, including pending logins.
max-clients=16
# normal: startup, connections, saves, warnings and errors; debug: protocol details too.
log-mode=normal

# UTF-8 log size per file in MiB and retained rotated files.
log-max-mib=10
log-retention=5

# Comma-separated pack IDs. Custom packs live under content/custom/packs/<id>.
content-packs=vanilla
# auto reads existing legacy resource layouts; disabled requires versioned packs.
legacy-content=auto

startup-map=haven

webui-enabled=true
webui-public-url=0.0.0.0
# One shared HTTP port for WebUI and public News, even when WebUI is disabled.
webui/content_url-port=8080
# http serves direct local/LAN access; reverse-proxy enables an HTTPS proxy.
webui-tls-mode=http
