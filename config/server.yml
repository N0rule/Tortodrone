# Restart the server after editing. Port 0 selects an ephemeral port for isolated tests.
server-ip: 0.0.0.0
server-port: 47624
max-clients: 16
log-mode: normal
log-max-mib: 10
log-retention: 5
# Folder name under content/maps; the existing startup flow requires a town.
startup-map: haven
# Shown once in chat after a knight enters the world. Set to "" to disable.
welcome-message: Welcome to Tortodrone!

# Administration starts on the shared HTTP listener by default.
webui-enabled: true
webui-public-url: 0.0.0.0
# One shared HTTP port for WebUI and public News, even when WebUI is disabled.
webui/content_url-port: 8080
# http serves direct local/LAN access; reverse-proxy enables an HTTPS proxy.
webui-tls-mode: http
