# Tortodrone server settings. Stop the server, edit, restart.
# Port 0 selects an ephemeral port for isolated tests.

# --- Network ---
server-ip: 0.0.0.0
server-port: 47624
# Maximum simultaneous game clients; pending logins count.
max-clients: 16

# --- Players ---
# Maximum knights in one player party (1-8). The client shows whoever joins, so this is
# admission policy rather than a client slot count.
party-max-players: 4
# Folder name under content/maps; the existing startup flow requires a town.
startup-map: haven
# Shown once in chat after a knight enters the world. Set to "" to disable.
welcome-message: Welcome to Tortodrone!

# --- Features ---
# false refuses new trade invitations. Open trades and everything else keep working.
trades-enabled: true
# false refuses player-authored text: scene, party, guild, private and emote lines.
# Server notices, commands and NPC dialogue still work.
chat-enabled: true

# --- Logging ---
log-mode: normal
log-max-mib: 10
log-retention: 5

# --- Administration ---
# Administration starts on the shared HTTP listener by default.
webui-enabled: true
webui-public-url: 0.0.0.0
# One shared HTTP port for WebUI and public News, even when WebUI is disabled.
webui/content_url-port: 8080
# http serves direct local/LAN access; reverse-proxy enables an HTTPS proxy.
webui-tls-mode: http
