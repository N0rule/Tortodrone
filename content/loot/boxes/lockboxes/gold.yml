# APPROXIMATION: wiki candidate pool, not official odds. Shadow Key is a reward, never an opening key.
# Families are equally selected. Each ordinary family uses the explicit 90/4/4/2 color split.
# Prismatic Glow-Eyes has only its documented Prismatic version; it has no invented standard colors.
boxes:
  lockbox_gold:
    kind: keyed
    acceptedKeys:
    - silver_key
    status: approximate
    evidence: 'https://wiki.spiralknights.com/Lockbox; box-specific candidate list; ALL rates estimated: Shadow Key 1%, aura category 1% if present,
      Iron modifiers 5%; remaining accessories; equal families; standard/divine/volcanic/prismatic colors 90/4/4/2'
    groups:
      main:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 9900, rewards: [{group: accessories}]}
        - {weight: 100, rewards: [{item: shadow_key, quantity: 1, binding: unbound}]}
      monocle:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 900, rewards: [{item: monocle_blue, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_gold, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_green, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_heavy, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_pink, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_purple, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: monocle_red, quantity: 1, binding: unbound}]}
        - {weight: 280, rewards: [{item: monocle_divine, quantity: 1, binding: unbound}]}
        - {weight: 280, rewards: [{item: monocle_volcanic, quantity: 1, binding: unbound}]}
        - {weight: 140, rewards: [{item: monocle_prismatic, quantity: 1, binding: unbound}]}
      round_shades: {shared: round_shades}
      canteen: {shared: canteen}
      glasses: {shared: glasses}
      maid_headband: {shared: maid_headband}
      mustache: {shared: mustache}
      ribbon: {shared: ribbon}
      toupee: {shared: toupee}
      dapper_combo: {shared: dapper_combo}
      accessories:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 1, rewards: [{group: monocle}]}
        - {weight: 1, rewards: [{group: round_shades}]}
        - {weight: 1, rewards: [{group: canteen}]}
        - {weight: 1, rewards: [{group: glasses}]}
        - {weight: 1, rewards: [{group: maid_headband}]}
        - {weight: 1, rewards: [{group: mustache}]}
        - {weight: 1, rewards: [{group: ribbon}]}
        - {weight: 1, rewards: [{group: toupee}]}
        - {weight: 1, rewards: [{group: dapper_combo}]}
