# APPROXIMATION: wiki candidate pool, not official odds. Shadow Key is a reward, never an opening key.
# Families are equally selected. Each ordinary family uses the explicit 90/4/4/2 color split.
# Prismatic Glow-Eyes has only its documented Prismatic version; it has no invented standard colors.
boxes:
  lockbox_copper:
    kind: keyed
    acceptedKeys:
    - silver_key
    status: approximate
    evidence: 'https://wiki.spiralknights.com/Lockbox; box-specific candidate list; ALL rates estimated: Shadow Key 1%, aura category 1% if present,
      Iron modifiers 5%; remaining accessories; equal families; standard/divine/volcanic/prismatic colors 90/4/4/2'
    groups:
      main:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 9800, rewards: [{group: accessories}]}
        - {weight: 100, rewards: [{item: shadow_key, quantity: 1, binding: unbound}]}
        - {weight: 100, rewards: [{group: auras}]}
      binoculars:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 900, rewards: [{item: binoculars_blue, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_gold, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_green, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_heavy, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_pink, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_purple, quantity: 1, binding: unbound}]}
        - {weight: 900, rewards: [{item: binoculars_red, quantity: 1, binding: unbound}]}
        - {weight: 280, rewards: [{item: binoculars_divine, quantity: 1, binding: unbound}]}
        - {weight: 280, rewards: [{item: binoculars_volcanic, quantity: 1, binding: unbound}]}
        - {weight: 140, rewards: [{item: binoculars_prismatic, quantity: 1, binding: unbound}]}
      flower: {shared: flower}
      glow_eyes: {shared: glow_eyes}
      headband: {shared: headband}
      long_feather: {shared: long_feather}
      pipe: {shared: pipe}
      plume: {shared: plume}
      wolver_tail: {shared: wolver_tail}
      accessories:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 1, rewards: [{group: binoculars}]}
        - {weight: 1, rewards: [{group: flower}]}
        - {weight: 1, rewards: [{group: glow_eyes}]}
        - {weight: 1, rewards: [{group: headband}]}
        - {weight: 1, rewards: [{group: long_feather}]}
        - {weight: 1, rewards: [{group: pipe}]}
        - {weight: 1, rewards: [{group: plume}]}
        - {weight: 1, rewards: [{group: wolver_tail}]}
      auras:
        chance: 100%
        rolls: 1
        entries:
        - {weight: 1, rewards: [{item: twilight_aura, quantity: 1, binding: unbound}]}
        - {weight: 1, rewards: [{item: twinkle_aura, quantity: 1, binding: unbound}]}
