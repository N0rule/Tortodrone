# APPROXIMATION: wiki candidate pool, not official odds. Shadow Key is a reward, never an opening key.
# Families are equally selected. Each ordinary family uses the explicit 90/4/4/2 color split.
# Prismatic Glow-Eyes has only its documented Prismatic version; it has no invented standard colors.
