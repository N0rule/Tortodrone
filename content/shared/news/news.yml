# Uplink News banners shown after knight login. Each request shows one pack at
# random; a pack is a featured banner with optional left/right spotlights. The
# stock client fetches each image as content_url + news/<file>, so the launcher's
# content_url must point at this server's news-port.
enabled: true
packs:
  - featured:
      image: featured.png
      tooltip: Tortodrone Server
      url: https://github.com/N0rule/Tortodrone
    spotlights:
      left:
        image: left.png
      right:
        image: right.png
