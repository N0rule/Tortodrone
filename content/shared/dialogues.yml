# Dialogue bodies shared by several map NPCs. An NPC uses one with
# `dialogue: {shared: <name>}`; the reference expands to this exact dialogue.
dialogues:
  energetic_knight:
    nodes:
      part 1a:
        responses:
        - text: Clearly I really should know all about this, tell me more!
          next: part 2a
        - text: No thanks, I'm content not knowing about such an amazing thing.
          close: true
        text: Do you know what the most important resource on Cradle is? ENERGY! That's right my friend, something so special it's worth shouting about! Want to know about this super important stuff? I happen to be an expert on the subject!
      part 2a:
        responses:
        - text: What is energy?
          next: part 3a
        - text: How is energy used?
          next: part 3b
        - text: How do I obtain more energy?
          next: part 3c
        - text: Your lessons have energized me! I'm off to adventure, bye!
          close: true
        text: 'Awesome! I''ll break it down for you in three easy lessons: what it is, how it''s used, and how you can get more.'
      part 3a:
        responses:
        - text: I have another question for you.
          next: part 2a
        - text: Your lessons have energized me! I'm off to adventure, bye!
          close: true
        text: Energy is a very special power that is constantly emanating from the core of this world. It is totally stable and will never be lost unless traded or spent. (You can see how much energy you have on the energy module in your arsenal.)
      part 3b:
        responses:
        - text: I have another question for you.
          next: part 2a
        - text: Your lessons have energized me! I'm off to adventure, bye!
          close: true
        text: "Energy is used for all sorts of things! It's the primary currency for buying goods from the Supply Depot, it allows you to purchase upgrades for yourself, revive yourself in the Clockworks when you run out of Sparks of Life, and it's required to form a guild. \n\nYou'll also find all sorts of devices in the world that are powered up by using energy. Just look for the blue energy symbol on the device."
      part 3c:
        responses:
        - text: I have another question for you.
          next: part 2a
        - text: Your lessons have energized me! I'm off to adventure, bye!
          close: true
        text: Energy can only be obtained by purchase with a real money transaction or for trade via the Exchange. To purchase or trade for energy, simply open the Supply Depot and click the 'Get Energy' button.
    initial: part 1a
  camp_greta:
    initial: part 1a
    nodes:
      part 1a:
        responses:
        - text: What's the problem, Greta?
          next: part 2a
        text: Greetings, I'm Squad Leader Greta.  You must be {0}. Rhendon said we should be expecting you, and not a moment too soon.  This Rescue Camp is facing a crisis.
      part 2a:
        responses:
        - text: How can I help channel power to the camp?
          next: part 3a
        text: "In short, this camp has no power and the sun is setting soon. Last night all manners of horrible monsters came after us in the dark.  We couldn't see and had no power for our defensive turrets. \n\n...we lost a lot of recruits. \n\nWe need to channel power to the Rescue Camp so that we can set up a defensive perimeter before night falls!"
      part 3a:
        responses:
        - text: I'll meet up with Rhendon before I investigate the generator.
          close: true
          action: 0
        text: "Our scans have located an ancient generator below this camp.  It should be sending power to the surface, but something seems to be diverting it. \n\nWe need you to go investigate the ancient generator and divert power back to the surface.  But you'll need to be ready- it's completely uncharted territory and teeming with monsters. \n\nRhendon said he wanted to meet up with you before you take on this mission.  Why don't you see him first?"
  camp_rhendon:
    initial: part 1a
    nodes:
      part 1a:
        responses:
        - text: Missions?
          next: part 2a
        text: Well, looks like we're in quite a bind here, {0}. There's plenty of work to be done to get this camp up and running, so you've now been authorized to receive missions! You can find any available missions in the Activities bar.
      part 2a:
        responses:
        - text: Yes, that's right.
          next: part 3a
        text: Missions range from dangerous combat engagements to talking to certain people, such as myself.  By completing missions, you'll earn progress towards new ranks, which will in turn give you access to increasingly powerful gear.  Greta informed me that you'll be tackling our power supply problem in the Ancient Generator?
      part 3a:
        responses:
        - text: Thanks, Rhendon.  I'll be careful.
          close: true
          action: 0
        text: Well, keep your wits about you. If the surface of this world is crawling with monsters, who knows what you'll find down there in the dark!
      part 4a:
        responses:
        - text: End conversation
          close: true
        text: Remember to accept that mission and be careful down there!
