name: Standalone tests

# The Gradle build stays test-free by design; this workflow is the CI gate that
# runs the standalone unit programs. Version tags are handled once by
# release.yml, which runs the unit and integration gates while packaging the
# release, so a tag does not start a second, duplicate suite here.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the older run instead of queueing a
# second full suite behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit programs (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run standalone unit programs
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testUnit
