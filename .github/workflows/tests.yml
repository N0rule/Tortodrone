name: Standalone tests

# The Gradle build stays test-free by design; this workflow is the CI gate that
# runs the standalone unit programs and the WebUI contract tests. Version tags are
# handled once by release.yml, which runs the packaged integration gates while
# packaging the release, so a tag does not start a second, duplicate suite here.
#
# Two jobs, because they answer different questions at very different costs:
#
#  - `webui` reads the frontend modules and stylesheets directly. 45 assertions over
#    1,400 lines of CSS/JS contracts run in about one second, and until this job
#    existed nothing in CI ever executed them.
#  - `unit` runs 268 standalone Java programs. They share one JVM and one process at a
#    time (several bind a fixed port), so the wall time is the sum of all of them:
#    ~40 minutes on one runner. Four shards on four runners divide that by four
#    without changing a single program; `-PunitShard=i/4` selects every fourth program
#    from the same sorted list, so the shards are deterministic and disjoint.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the older run instead of queueing a
# second full suite behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    name: WebUI contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run WebUI contract tests
        shell: bash
        run: |
          # The suite reads frontend/ by relative path, so it needs no
          # build step and no game installation.
          node --test src/test/webui/*-test.mjs

      - name: Check the frontend modules parse
        shell: bash
        run: |
          for module in frontend/assets/*.js frontend/assets/components/*.js \
                        frontend/assets/pages/*.js; do
            node --check "$module"
          done

  unit:
    name: Unit programs (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          # Key the cached dependency store on the wrapper, not on the build script.
          # `cache: gradle` hashes every `*.gradle*` file by default, so any commit that
          # touched build.gradle.kts threw away all four shards' caches at once; the four
          # cold shards then fetched the whole classpath together and Maven Central
          # answered 429. Gradle's own cache is version-keyed and self-healing, so a
          # restore that predates a build-script edit only re-fetches what is new.
          cache-dependency-path: gradle/wrapper/gradle-wrapper.properties

      - name: Run standalone unit programs (shard ${{ matrix.shard }})
        shell: bash
        run: |
          chmod +x ./gradlew
          # Dependency resolution is the one part of this job that can fail for reasons
          # outside the repository: a 429 from Maven Central lands before a single program
          # runs. Retry that shape of failure, and only that shape -- a program that fails
          # its assertions must fail the job on the first attempt.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon testUnit -PunitShard=${{ matrix.shard }}/4 2>&1 \
                | tee "$RUNNER_TEMP/unit.log"; then
              exit 0
            fi
            if ! grep -qE 'status code 429|Could not GET|Could not HEAD|Read timed out|Connection reset' \
                "$RUNNER_TEMP/unit.log"; then
              exit 1
            fi
            echo "Transient dependency download failure on attempt $attempt; retrying." >&2
            sleep $((attempt * 30))
          done
          exit 1
