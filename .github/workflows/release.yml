name: Release Tortodrone

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases publish under distinct tag refs; never cancel a run that may already
# be uploading an artifact.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish portable ZIP (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match v$version from VERSION." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$GITHUB_REF_NAME"; then
            echo "Missing existing Git tag '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # One Gradle invocation runs both gates and builds the release archive, so
      # the tag does not pay for a separate checkout and build in another run.
      - name: Run release gates and build portable release
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testUnit testIntegration

      - name: Package one portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          package="Tortodrone-v$version"
          mkdir -p release

          test -s dist/tortodrone.jar
          test -s dist/webui/index.html
          test -s dist/webui/assets/app.js
          test -s dist/webui/assets/api.js
          for stylesheet in tokens base layout components pages; do
            test -s "dist/webui/assets/css/$stylesheet.css"
          done
          test -f dist/content/maps/town/haven/map.yml
          test -f dist/content/maps/level/crash_site/native/scene.dat
          test -f dist/content/maps/town/rescue_camp/native/scene.dat
          java -cp dist/tortodrone.jar scripts/build/CheckOpeningDeployment.java dist
          test -f dist/content/items/weapons.yml
          test -d dist/config
          test -d dist/plugins

          # Publish the same clean, layout-checked archive as local portableZip.
          cp "build/distributions/$package.zip" "release/$package.zip"
          sha256sum "release/$package.zip"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Run your own Spiral Knights server

          Tortodrone is a Java 25 development server for the unmodified Spiral Knights client. This is not a complete replacement for the official server.

          ### Quick start
          1. Install a full **JDK 25** and download the **Tortodrone ZIP** below (not GitHub's source-code archives).
          2. Extract the whole ZIP into a new folder and run `java -jar tortodrone.jar` from that folder.
          3. Follow `README.md` to create an account and connect through KnightLauncherCustom using your server's public key.

          New knights start in **Crash Site** and travel **directly to Haven** after completing it. The legacy Rescue Camp route is not required. General missions, guilds, PvP and Arcade gameplay remain incomplete; see the supported-scope table in the README.

          ### Included
          - One server JAR, default configuration, supported content, plugins folder and optional WebUI.
          - Documentation and required license/attribution notices under `docs/`.
          - No Java runtime, game client, accounts, private keys or extracted client artwork. With the WebUI enabled, missing artwork can be prepared locally from your installed client.

          ### Updating an existing server
          Stop the server and back up `data/`, `config/` and customized `content/`. Preserve those files and `webui/assets/game/`; do not overwrite your configuration/content blindly with fresh defaults. The 0.42.0 baseline uses schema 1; later builds apply ordered migrations after taking their own backup. A pre-0.42.0 or unknown database is refused untouched — keep it as a backup and start the new baseline. See `docs/operations.md`.

          Licensed under PolyForm Noncommercial 1.0.0. Retain the N0rule/Tortodrone attribution notice; see `docs/LICENSE`, `docs/NOTICE` and `docs/provenance.md`.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "release/Tortodrone-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "Tortodrone $GITHUB_REF_NAME (development)"
