name: Release Tortodrone

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish portable ZIP (Java 25)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' must match v$version from VERSION." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$GITHUB_REF_NAME"; then
            echo "Missing existing Git tag '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build without tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Package one portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          package="Tortodrone-v$version"
          root="$RUNNER_TEMP/$package"
          mkdir "$root"
          mkdir -p dist

          test -s build/tortodrone.jar
          test -s build/webui/index.html
          test -s build/webui/assets/app.js
          test -s build/webui/assets/api.js
          for stylesheet in tokens base layout components pages; do
            test -s "build/webui/assets/css/$stylesheet.css"
          done
          test -f build/content/maps/haven/map.yml
          test -f build/content/items/weapons.yml
          test -d build/config
          test -d build/plugins

          # Package only deployment inputs; never local bundles, logs or scratch.
          cp build/tortodrone.jar "$root/"
          for directory in config content plugins webui; do
            cp -a "build/$directory" "$root/$directory"
          done
          cp -a docs "$root/docs"
          cp -a licenses "$root/licenses"
          cp -a src/main/resources/licenses/. "$root/licenses/"
          cp src/main/resources/THIRD-PARTY.md "$root/THIRD-PARTY.md"
          cp VERSION README.md LICENSE NOTICE CONTRIBUTING.md "$root/"

          if find "$root" -type l -print -quit | grep -q .; then
            echo "Refusing to publish symlinks in the release." >&2
            exit 1
          fi

          java -cp "$root/tortodrone.jar" org.tortodrone.resources.ContentManager "$root"

          # Do not release persistent user data, private keys, or captures.
          if find "$root" -type f \( \
            -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \
            -o -name '*.db-journal' -o -name '*.sqlite*' \
            -o -name '*.key' -o -name '*.pk8' -o -name '*.pem' \
            -o -path '*/keys/*' -o -name '*.hprof' \
            -o -name '*.bundle' -o -name '*.log' \
            -o -name 'private.txt' -o -name '*.pcap*' \
            -o -name 'tokens.json' \
          \) -print -quit | grep -q .; then
            echo "Refusing to publish runtime state, secrets or captures." >&2
            exit 1
          fi
          test ! -d "$root/data"
          test ! -d "$root/content-updates"
          if test -d "$root/webui/assets/game/icons"; then
            echo "Refusing to publish locally extracted client artwork; use the source-owned fallback pack." >&2
            exit 1
          fi

          # Python's standard library avoids depending on platform zip utilities.
          python3 - "$root" "$GITHUB_WORKSPACE/dist/$package.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import sys
          source, target = map(Path, sys.argv[1:])
          with ZipFile(target, "x", compression=ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source).as_posix())
          with ZipFile(target) as archive:
              assert archive.testzip() is None, "Invalid release ZIP"
          PY
          sha256sum "dist/$package.zip"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/Tortodrone-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --prerelease \
            --notes "Development release under PolyForm Noncommercial 1.0.0; preserve the N0rule/Tortodrone attribution notice. JDK 25 required. Extract the complete ZIP and run java -jar tortodrone.jar. WebUI images are prepared locally from your installed client on first startup. Seven town/interior maps are bundled; new-knight creation requires separately imported Crash Site 398 and initial Rescue Camp 217. The complete opening route to Haven remains unfinished. See README.md and docs/content.md before testing." \
            --title "Tortodrone $GITHUB_REF_NAME (development)"
